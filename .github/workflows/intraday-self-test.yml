name: Intraday AI Self Test

on:
  push:
    branches: [main]

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Live Yahoo connectivity
        run: |
          python - <<'PY'
          import json, urllib.request
          symbols=['RELIANCE.NS','TCS.NS','INFY.NS','HDFCBANK.NS','SBIN.NS']
          ok=0
          for s in symbols:
              u=f'https://query1.finance.yahoo.com/v8/finance/chart/{s}?range=1d&interval=5m&includePrePost=false'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      d=json.load(r)
                  q=d['chart']['result'][0]['indicators']['quote'][0]['close']
                  vals=[x for x in q if x is not None]
                  print(s, 'OK', len(vals))
                  ok += bool(len(vals)>=25)
              except Exception as e:
                  print(s, 'FAIL', repr(e))
          if ok < 3:
              raise SystemExit(f'Yahoo connectivity test failed: only {ok}/5 symbols usable')
          print(f'Yahoo connectivity PASS: {ok}/5 symbols usable')
          PY
      - name: Full scanner test
        run: |
          python - <<'PY'
          import app
          rows=app.scan()
          good=[x for x in rows if not x.get('error')]
          print(f'FULL SCAN: {len(good)}/{len(rows)} usable')
          for x in good[:10]:
              print(x['symbol'], x['price'], x['signal'], x['score'])
          if len(good) < 10:
              raise SystemExit(f'Full scanner test failed: only {len(good)}/{len(rows)} usable')
          PY
